server.port=0
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

spring.datasource.url=jdbc:h2:mem:escola_aviacao_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

seed.enabled=false
security.disable=true
seed.students.enabled=false
seed.admin.password=admin123
seed.student.password=aluno123

jwt.secret=test_secret_change_me_please_32_chars_min
jwt.expiration-minutes=30
