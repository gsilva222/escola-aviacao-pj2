# Configurações da Aplicação Web

# Server
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=escola-aviacao-api

# Datasource
# Production/local runtime must provide these values via environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Security / JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXP_MIN:120}

# Uploads
app.upload.dir=${UPLOAD_DIR:./uploads}

# Seed
seed.enabled=${SEED_ENABLED:true}
seed.business.enabled=${SEED_BUSINESS:true}
seed.students.enabled=${SEED_STUDENTS:true}
seed.admin.username=${SEED_ADMIN_USER:admin}
seed.admin.password=${SEED_ADMIN_PASS}
seed.student.password=${SEED_STUDENT_PASS}

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger

# Logging
logging.level.root=INFO
logging.level.pt.ipvc.estg=DEBUG
