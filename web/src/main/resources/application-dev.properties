# Perfil dev — arranque local sem Docker
spring.config.activate.on-profile=dev

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5432/aeroschool
spring.datasource.username=aeroschool
spring.datasource.password=aeroschool
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=dev_secret_change_me_please_32_chars_min
jwt.expiration-minutes=120
auth.allow-public-admin-register=false

seed.enabled=true
seed.business.enabled=true
seed.students.enabled=true
seed.admin.username=admin
seed.admin.password=admin123
seed.student.password=aluno123

app.upload.dir=./uploads

management.endpoints.web.exposure.include=health,info
